        }
        push(x: number): void {
          if (this.size >= this.capacity) throw new RangeError('queue is full');
          this.items.push(x);
          this.size++;
        }
        pop(): number {
          this.size--;
          if (this.items.length === 0) throw new RangeError('queue is empty');
          return this.items.shift()!;
        }
        state() {
          return { items: this.items, size: this.size, capacity: this.capacity };
        }
      }
  lifo:
    bug: pop returns the newest item (the spec does not check pop's return value)
    code: |
      /** FIFO queue holding at most `capacity` items. Push when full and pop when empty are refused. */
      export class BoundedQueue {
        capacity: number;
        items: number[] = [];
        size = 0;
