          this.items.push(x);
          this.size++;
        }
        pop(): number {
          if (this.size === 0) throw new RangeError('queue is empty');
          this.size--;
          return this.items.pop()!;
        }
        state() {
          return { items: this.items, size: this.size, capacity: this.capacity };
        }
      }
