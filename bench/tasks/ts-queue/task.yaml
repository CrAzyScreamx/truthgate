title: Bounded FIFO queue (capacity 3); push when full and pop when empty are refused
target: src/queue.ts
spec: |
  id: queue.bounded
  target: src/queue.ts::BoundedQueue
  lang: ts
  kind: sequence
  ops:
    - name: push
      inputs: { x: "int[0,9]" }
    - name: pop
      inputs: {}
  invariant:
    - name: within_capacity
      expr: "len(state.items) <= state.capacity"
    - name: size_matches
      expr: "state.size == len(state.items)"
examples:
  - steps:
      - { op: push, input: { x: 1 } }
      - { op: push, input: { x: 2 } }
      - { op: pop, input: {}, out: 1 }
    state: { items: [2], size: 1, capacity: 3 }
  - steps:
      - { op: push, input: { x: 1 } }
      - { op: push, input: { x: 2 } }
      - { op: push, input: { x: 3 } }
      - { op: push, input: { x: 4 }, rejected: true }
  - steps:
      - { op: pop, input: {}, rejected: true }
variants:
  ok:
    bug: none
    code: |
      /** FIFO queue holding at most `capacity` items. Push when full and pop when empty are refused. */
      export class BoundedQueue {
        capacity: number;
        items: number[] = [];
        size = 0;
        constructor(capacity = 3) {
          this.capacity = capacity;
        }
        push(x: number): void {
          if (this.size >= this.capacity) throw new RangeError('queue is full');
          this.items.push(x);
          this.size++;
        }
        pop(): number {
          if (this.size === 0) throw new RangeError('queue is empty');
          this.size--;
          return this.items.shift()!;
        }
        state() {
          return { items: this.items, size: this.size, capacity: this.capacity };
        }
      }
  full_off_by_one:
    bug: the full check uses > instead of >=, so a fourth item fits
    code: |
