  pop_empty_counter:
    bug: pop decrements the size counter before refusing an empty queue
    code: |
      /** FIFO queue holding at most `capacity` items. Push when full and pop when empty are refused. */
      export class BoundedQueue {
        capacity: number;
        items: number[] = [];
        size = 0;
        constructor(capacity = 3) {
